<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔫 FPS SHOOTER | Atire nos alvos - Jogo de tiro em primeira pessoa</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0f1e 0%, #03060c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 20px;
        }

        .game-container {
            background: #0b1018;
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid #2e3a48;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 0 0 2px #2c3e33, 0 10px 25px rgba(0,0,0,0.5);
            cursor: none;
            background: #1a212b;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            margin-top: 18px;
            margin-bottom: 10px;
            background: #0c131fcc;
            backdrop-filter: blur(8px);
            padding: 8px 24px;
            border-radius: 60px;
            border: 1px solid #3e5a6b;
        }

        .stats {
            display: flex;
            gap: 30px;
            background: #03080e;
            padding: 6px 24px;
            border-radius: 40px;
            box-shadow: inset 0 1px 3px #00000044, 0 2px 6px black;
        }

        .stat {
            text-align: center;
            color: #eef5ff;
            font-weight: bold;
        }

        .stat span:first-child {
            font-size: 0.8rem;
            letter-spacing: 2px;
            background: #1f4a5c;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            margin-left: 8px;
            font-family: monospace;
            color: #ffb347;
            text-shadow: 0 0 6px #ff7b00;
        }

        button {
            background: #da3a2a;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 6px 22px;
            border-radius: 60px;
            color: white;
            font-family: monospace;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 4px 0 #731f12;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #731f12;
        }

        .crosshair {
            position: fixed;
            width: 28px;
            height: 28px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999;
            filter: drop-shadow(0 0 3px cyan);
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
            box-shadow: 0 0 4px #0ff;
        }
        .crosshair::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }
        .crosshair::after {
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
        .hit-effect {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffcc44, #ff3300);
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: hitFlash 0.2s ease-out forwards;
            z-index: 1000;
        }

        @keyframes hitFlash {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }

        .controls {
            display: flex;
            gap: 12px;
            color: #97c7e0;
            background: #0e1622a0;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .controls kbd {
            background: #010a0f;
            padding: 2px 8px;
            border-radius: 30px;
            color: #ffcf7a;
            margin: 0 3px;
        }

        @media (max-width: 700px) {
            .stats { gap: 12px; padding: 4px 12px; }
            .stat-value { font-size: 1.5rem; }
            button { padding: 4px 18px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="550"></canvas>
        <div class="info-panel">
            <div class="stats">
                <div class="stat">
                    <span>🎯 PONTOS</span>
                    <span class="stat-value" id="scoreValue">0</span>
                </div>
                <div class="stat">
                    <span>⏱️ TEMPO</span>
                    <span class="stat-value" id="timerValue">30</span>
                </div>
                <div class="stat">
                    <span>🏆 RECORDE</span>
                    <span class="stat-value" id="highscoreValue">0</span>
                </div>
            </div>
            <button id="resetBtn">🔫 REINICIAR</button>
        </div>
        <div class="controls">
            <span>🎯 MIRA: mova o mouse e CLIQUE para ATIRAR</span>
            <span><kbd>R</kbd> reiniciar</span>
            <span>💀 ACERTE OS ALVOS ANTES QUE SUMAM!</span>
        </div>
    </div>
    <div class="crosshair" id="customCrosshair"></div>
</div>

<script>
    (function(){
        // ---------- JOGO FPS: ATIRE NOS ALVOS QUE SE MOVEM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreValue');
        const timerSpan = document.getElementById('timerValue');
        const highScoreSpan = document.getElementById('highscoreValue');
        const resetBtn = document.getElementById('resetBtn');
        const crosshair = document.getElementById('customCrosshair');

        // Dimensões
        const W = 900;
        const H = 550;
        canvas.width = W;
        canvas.height = H;

        // Configurações do jogo
        let score = 0;
        let timeLeft = 30;       // segundos
        let gameActive = true;
        let highscore = 0;
        
        // Array de inimigos (alvos)
        let enemies = [];
        const MAX_ENEMIES = 9;
        let spawnInterval = null;
        let gameLoopInterval = null;
        let timerInterval = null;
        
        // Efeitos visuais
        let hitParticles = [];     // { x, y, life }
        
        // Cores / estilo dos inimigos
        const ENEMY_RADIUS = 28;
        
        // Classe inimigo (alvo móvel)
        class Enemy {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx || (Math.random() - 0.5) * 2.8;
                this.vy = vy || (Math.random() - 0.5) * 2.5;
                this.radius = ENEMY_RADIUS;
                this.life = true;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                // rebater nas bordas com margem
                if(this.x - this.radius < 0) { this.x = this.radius; this.vx = -this.vx; }
                if(this.x + this.radius > W) { this.x = W - this.radius; this.vx = -this.vx; }
                if(this.y - this.radius < 0) { this.y = this.radius; this.vy = -this.vy; }
                if(this.y + this.radius > H) { this.y = H - this.radius; this.vy = -this.vy; }
            }
            
            draw(ctx) {
                // desenha um alvo "maligno" estilo FPS com cara de monstro
                ctx.save();
                ctx.shadowBlur = 4;
                ctx.shadowColor = "#ff0000aa";
                // corpo do inimigo (círculo vermelho-escuro)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = "#9e2a2a";
                ctx.fill();
                ctx.strokeStyle = "#ff6a4b";
                ctx.lineWidth = 2.5;
                ctx.stroke();
                // olhos amarelos malignos
                ctx.beginPath();
                ctx.arc(this.x - 12, this.y - 8, 6, 0, Math.PI*2);
                ctx.fillStyle = "#f5e56b";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 12, this.y - 8, 6, 0, Math.PI*2);
                ctx.fill();
                // pupilas
                ctx.fillStyle = "#1f1a0c";
                ctx.beginPath();
                ctx.arc(this.x - 12 + (Math.sin(Date.now() * 0.008) * 1.5), this.y - 9, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 12 + (Math.cos(Date.now() * 0.008) * 1.5), this.y - 9, 3, 0, Math.PI*2);
                ctx.fill();
                // boca zangada
                ctx.beginPath();
                ctx.arc(this.x, this.y + 8, 12, 0.05, Math.PI - 0.05);
                ctx.strokeStyle = "#4a1a0a";
                ctx.lineWidth = 3;
                ctx.stroke();
                // sobrancelhas
                ctx.beginPath();
                ctx.moveTo(this.x - 18, this.y - 16);
                ctx.lineTo(this.x - 8, this.y - 18);
                ctx.lineTo(this.x - 12, this.y - 14);
                ctx.fillStyle = "#2e241a";
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(this.x + 18, this.y - 16);
                ctx.lineTo(this.x + 8, this.y - 18);
                ctx.lineTo(this.x + 12, this.y - 14);
                ctx.fill();
                ctx.restore();
                
                // detalhe de caveira
                ctx.font = `bold 18px monospace`;
                ctx.fillStyle = "#ffcf9a";
                ctx.shadowBlur = 0;
                ctx.fillText("💀", this.x-13, this.y+10);
            }
        }
        
        // Funções auxiliares
        function updateUI() {
            scoreSpan.innerText = score;
            timerSpan.innerText = Math.floor(timeLeft);
            if(score > highscore) {
                highscore = score;
                highScoreSpan.innerText = highscore;
            }
        }
        
        // Adicionar um novo inimigo (respeitando limites)
        function spawnEnemy() {
            if(!gameActive) return;
            if(enemies.length >= MAX_ENEMIES) return;
            // Posição aleatória, mas evitando colisão instantânea com o mouse? não precisa
            let x = Math.random() * (W - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            let y = Math.random() * (H - 2 * ENEMY_RADIUS) + ENEMY_RADIUS;
            // velocidade variada
            let vx = (Math.random() - 0.5) * 2.2;
            let vy = (Math.random() - 0.5) * 2.2;
            enemies.push(new Enemy(x, y, vx, vy));
        }
        
        // Efeito de impacto visual
        function addHitEffect(x, y) {
            hitParticles.push({ x, y, life: 1.0 });
        }
        
        // Disparo: detecta se clicou em algum inimigo
        function shootAt(mouseX, mouseY) {
            if(!gameActive) return false;
            let hit = false;
            for(let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                const dx = mouseX - e.x;
                const dy = mouseY - e.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if(dist <= e.radius) {
                    // acertou!
                    enemies.splice(i,1);
                    score += 10;
                    updateUI();
                    addHitEffect(mouseX, mouseY);
                    hit = true;
                    // feedback sonoro simulado (vibração visual)
                    canvas.style.transform = "scale(0.99)";
                    setTimeout(() => { canvas.style.transform = ""; }, 80);
                    break;
                }
            }
            // efeito de tiro mesmo sem acertar: pequeno flash na mira
            if(!hit) {
                // flash de tiro falho (borda vermelha)
                canvas.style.boxShadow = "0 0 0 2px #ff4422, 0 10px 25px black";
                setTimeout(() => { canvas.style.boxShadow = "0 0 0 2px #2c3e33, 0 10px 25px rgba(0,0,0,0.5)"; }, 100);
            } else {
                canvas.style.boxShadow = "0 0 0 3px #ffdd77, 0 10px 25px black";
                setTimeout(() => { canvas.style.boxShadow = "0 0 0 2px #2c3e33, 0 10px 25px rgba(0,0,0,0.5)"; }, 100);
            }
            return hit;
        }
        
        // game over
        function endGame() {
            if(!gameActive) return;
            gameActive = false;
            if(spawnInterval) clearInterval(spawnInterval);
            if(timerInterval) clearInterval(timerInterval);
            spawnInterval = null;
            timerInterval = null;
        }
        
        // reset total do jogo
        function resetGame() {
            // parar loops antigos
            if(spawnInterval) clearInterval(spawnInterval);
            if(timerInterval) clearInterval(timerInterval);
            gameActive = true;
            score = 0;
            timeLeft = 30;
            enemies = [];
            hitParticles = [];
            updateUI();
            
            // spawnar alguns inimigos iniciais
            for(let i=0; i<4; i++) {
                spawnEnemy();
            }
            // agendar spawn contínuo
            spawnInterval = setInterval(() => {
                if(gameActive && enemies.length < MAX_ENEMIES) {
                    spawnEnemy();
                }
            }, 750);
            
            // timer decrescente
            timerInterval = setInterval(() => {
                if(gameActive && timeLeft > 0) {
                    timeLeft -= 0.1;
                    if(timeLeft <= 0) {
                        timeLeft = 0;
                        updateUI();
                        endGame();
                    } else {
                        updateUI();
                    }
                } else if (!gameActive) {
                    if(timerInterval) clearInterval(timerInterval);
                }
            }, 100);
        }
        
        // ---------- RENDERIZAÇÃO (background FPS, mira custom, alvos, sangue) ----------
        function drawBackground() {
            // chão / parede estilo bunker
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, "#1f2d3a");
            grad.addColorStop(1, "#0f1722");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            
            // grid de chão (perspectiva de corredor)
            ctx.strokeStyle = "#3e5a6e";
            ctx.lineWidth = 1;
            for(let i = 0; i < 20; i++) {
                let y = H - i * 28;
                if(y < 0) break;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
            for(let i = 0; i < 18; i++) {
                let x = i * 55;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            // manchas de sangue/combate
            ctx.globalAlpha = 0.15;
            for(let s=0; s<40; s++) {
                ctx.fillStyle = "#9a2e2e";
                ctx.beginPath();
                ctx.arc(50 + Math.random() * (W-100), Math.random() * H, 8+Math.random()*20, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        
        function drawEnemies() {
            for(let e of enemies) {
                e.draw(ctx);
            }
        }
        
        function drawParticles() {
            for(let i=0; i<hitParticles.length; i++) {
                const p = hitParticles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12 * (1 - p.life), 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 80, 40, ${p.life * 0.9})`;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x+ (Math.random()-0.5)*6, p.y+ (Math.random()-0.5)*6, 5 * p.life, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255, 200, 50, ${p.life})`;
                ctx.fill();
                p.life -= 0.08;
                if(p.life <= 0) {
                    hitParticles.splice(i,1);
                    i--;
                }
            }
        }
        
        // desenha a mira customizada (também movida com mouse)
        // (já temos um div crosshair, mas no canvas também para reforço)
        function drawCanvasCrosshair() {
            // já temos crosshair via div, mas desenhamos um minimalista
            ctx.beginPath();
            ctx.strokeStyle = "#e0ffc0";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 0;
            // é apenas estético
        }
        
        function drawGameOverlay() {
            if(!gameActive) {
                ctx.fillStyle = "#000000aa";
                ctx.fillRect(0, 0, W, H);
                ctx.font = `bold 44px "Courier New", monospace`;
                ctx.fillStyle = "#ffaa66";
                ctx.textAlign = "center";
                ctx.fillText("🔫 GAME OVER", W/2, H/2 - 50);
                ctx.font = `26px monospace`;
                ctx.fillStyle = "#fcd48e";
                ctx.fillText(`PONTUAÇÃO FINAL: ${score}`, W/2, H/2 + 20);
                ctx.font = `18px monospace`;
                ctx.fillStyle = "#84f0ff";
                ctx.fillText("Clique em REINICIAR ou aperte R", W/2, H/2 + 90);
                ctx.textAlign = "left";
            }
        }
        
        // ciclo de animação e atualização
        function updateEnemiesMovement() {
            if(!gameActive) return;
            for(let e of enemies) {
                e.update();
            }
        }
        
        // Sincroniza mira do mouse com o div crosshair
        function moveCrosshair(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseXCanvas = (e.clientX - rect.left) * scaleX;
            let mouseYCanvas = (e.clientY - rect.top) * scaleY;
            if(mouseXCanvas >= 0 && mouseXCanvas <= W && mouseYCanvas >=0 && mouseYCanvas <= H) {
                crosshair.style.left = e.clientX + 'px';
                crosshair.style.top = e.clientY + 'px';
                crosshair.style.display = 'block';
            } else {
                crosshair.style.display = 'none';
            }
            
            // guardar para uso em cliques? mas o clique usa coordenadas absolutas
        }
        
        // disparo via clique no canvas
        function canvasClick(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            if(mouseX >=0 && mouseX <= W && mouseY>=0 && mouseY<=H) {
                shootAt(mouseX, mouseY);
            }
        }
        
        // animação principal
        function animate() {
            if(gameActive) {
                updateEnemiesMovement();
            }
            drawBackground();
            drawEnemies();
            drawParticles();
            drawCanvasCrosshair();
            drawGameOverlay();
            requestAnimationFrame(animate);
        }
        
        // Carregar recorde do localStorage (opcional)
        function loadHighScore() {
            let saved = localStorage.getItem('fps_shooter_highscore');
            if(saved !== null) {
                highscore = parseInt(saved) || 0;
                highScoreSpan.innerText = highscore;
            } else {
                highscore = 0;
            }
        }
        
        function saveHighScore() {
            if(score > highscore) {
                highscore = score;
                localStorage.setItem('fps_shooter_highscore', highscore);
                highScoreSpan.innerText = highscore;
            }
        }
        
        // sobrescrever updateUI para salvar recorde sempre que atualizar
        const originalUpdate = updateUI;
        window.updateUI = function() {
            originalUpdate();
            if(score > highscore) {
                highscore = score;
                highScoreSpan.innerText = highscore;
                localStorage.setItem('fps_shooter_highscore', highscore);
            }
        };
        updateUI = window.updateUI;
        
        // Reset completo com salvamento
        function fullReset() {
            if(spawnInterval) clearInterval(spawnInterval);
            if(timerInterval) clearInterval(timerInterval);
            gameActive = true;
            score = 0;
            timeLeft = 30;
            enemies = [];
            hitParticles = [];
            updateUI();
            for(let i=0;i<4;i++) spawnEnemy();
            spawnInterval = setInterval(() => {
                if(gameActive && enemies.length < MAX_ENEMIES) spawnEnemy();
            }, 720);
            timerInterval = setInterval(() => {
                if(gameActive && timeLeft > 0) {
                    timeLeft -= 0.1;
                    if(timeLeft <= 0) {
                        timeLeft = 0;
                        updateUI();
                        endGame();
                        saveHighScore();
                    } else { updateUI(); }
                } else if(!gameActive && timerInterval) clearInterval(timerInterval);
            }, 100);
        }
        
        // Listener de teclado para reset com R
        function handleKey(e) {
            if(e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                fullReset();
            }
        }
        
        // Inicializar evento de mouse, resetar jogo
        function init() {
            loadHighScore();
            fullReset();
            canvas.addEventListener('click', canvasClick);
            window.addEventListener('mousemove', moveCrosshair);
            window.addEventListener('keydown', handleKey);
            resetBtn.addEventListener('click', () => {
                fullReset();
            });
            animate();
            // esconde crosshair quando sair da tela
            canvas.addEventListener('mouseleave', () => {
                crosshair.style.display = 'none';
            });
            canvas.addEventListener('mouseenter', (e) => {
                crosshair.style.display = 'block';
                moveCrosshair(e);
            });
            // garantir que a mira não suma
            crosshair.style.display = 'block';
        }
        
        init();
    })();
</script>
</body>
</html>
